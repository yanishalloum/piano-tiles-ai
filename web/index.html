<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano Tiles AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room">
    <header class="liner">
      <h1 id="title">Piano Tiles AI</h1>
      <p id="details">Chargement du morceau…</p>
      <p class="legend">
        <span class="swatch swatch-left"></span>Main gauche
        <span class="swatch swatch-right"></span>Main droite
      </p>
    </header>
    <canvas id="stage" aria-label="Les notes du morceau tombent vers le clavier"></canvas>
    <p id="status" class="hint">Espace ou clic pour lancer la lecture</p>
  </main>
  <audio id="player" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
