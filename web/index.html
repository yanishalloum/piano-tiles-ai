<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano Tiles AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room">
    <header class="liner">
      <h1 id="title">Piano Tiles AI</h1>
      <p id="details">Chargement du morceau…</p>
      <p class="legend">
        <span class="swatch swatch-left"></span>Main gauche
        <span class="swatch swatch-right"></span>Main droite
      </p>
    </header>

    <canvas id="stage" aria-label="Les notes du morceau tombent vers le clavier"></canvas>

    <section class="transport" aria-label="Commandes de lecture">
      <button id="play" class="play" type="button">Lecture</button>
      <button id="back" type="button" aria-label="Reculer de 5 secondes">−5 s</button>
      <button id="forward" type="button" aria-label="Avancer de 5 secondes">+5 s</button>

      <div class="timeline">
        <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Position dans le morceau">
        <span id="clock" class="clock">0:00 / 0:00</span>
      </div>

      <div class="source" role="group" aria-label="Ce qu'on entend">
        <button type="button" data-source="mix" aria-pressed="true">Morceau complet</button>
        <button type="button" data-source="piano" aria-pressed="false">Piano seul</button>
      </div>

      <label class="speed">
        Vitesse
        <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1">
        <output id="speed-value" for="speed">×1</output>
      </label>
      <label class="names">
        Notes
        <select id="names">
          <option value="none">Masquées</option>
          <option value="english">C D E</option>
          <option value="solfege">Do Ré Mi</option>
        </select>
      </label>
    </section>
  </main>

  <audio id="audio-mix" preload="auto"></audio>
  <audio id="audio-piano" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
