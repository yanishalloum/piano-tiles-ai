[project]
name = "piano-tiles-ai"
version = "0.1.0"
description = "Extract piano notes from any song and display it as piano tiles"
readme = "README.md"
authors = [
    { name = "yanishalloum", email = "yanishalloum@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
piano-tiles-ai = "piano_tiles_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

