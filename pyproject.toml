[project]
name = "piano-tiles-ai"
version = "0.1.0"
description = "Extract piano notes from any song and display it as piano tiles"
readme = "README.md"
authors = [
    { name = "yanishalloum", email = "yanishalloum@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bs-roformer-infer>=0.1.5",
    "demucs>=4.0.1",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    # transkun 2.0.1 imports pkg_resources, removed from recent setuptools
    "numpy>=2.4.6",
    "pretty-midi>=0.2.11.post0",
    "setuptools<81",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    # Required by transkun. 2.11.0 is torchaudio's final release (maintenance mode).
    # Must come from the same CUDA index as torch (see [tool.uv.sources]).
    "torchaudio==2.11.0",
    "transkun>=2.0.1",
]

[project.scripts]
piano-tiles-ai = "piano_tiles_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
