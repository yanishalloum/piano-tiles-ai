[project]
name = "piano-tiles-ai"
version = "0.1.0"
description = "Extract piano notes from any song and display it as piano tiles"
readme = "README.md"
authors = [
    { name = "yanishalloum", email = "yanishalloum@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "soundfile>=0.14.0",
]

[project.scripts]
piano-tiles-ai = "piano_tiles_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]

